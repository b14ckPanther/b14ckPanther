<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="t d">
  <title id="t">Darb Scouter</title>
  <desc id="d">Reads each new junior job in Israel at 07:00 and scores it against my CV, quote by quote. The model reads; plain, tested code scores No quote from the post, no points Hebrew and English hybrid search Built with Python, FastAPI, LangGraph, Elasticsearch. Status: working.</desc>
