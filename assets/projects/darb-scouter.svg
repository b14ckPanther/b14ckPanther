  <g font-family="Ubuntu, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <text x="40" y="76" fill="#fbf7ec" font-size="32" font-weight="700" letter-spacing="-0.4">Darb Scouter</text>
  <text fill="#a9b8ad" font-size="18.5"><tspan x="40" y="114">Reads each new junior job in Israel at 07:00</tspan><tspan x="40" dy="26">and scores it against my CV, quote by quote.</tspan></text>
