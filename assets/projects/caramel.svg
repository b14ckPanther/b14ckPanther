  <title id="t">Caramel</title>
  <desc id="d">A menu that is not a list: caramel pours down the page and wraps each dish. Built for a gluten-free kitchen in Akko. Its own admin for dishes, sizes and media. Shown as a live preview on its Darb card. Built with Next.js, Supabase, built with Lama. caramel.darb.co.il</desc>
