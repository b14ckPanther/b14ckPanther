<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="t d">
  <title id="t">YellowShifts</title>
  <desc id="d">Shift scheduling and attendance for fuel stations. In pilot at a working Paz station. Workers clock in by tapping an NFC tag. Access enforced by Postgres row-level security. One hours engine for web, admin and mobile. Built with Next.js 16, Expo, Supabase. paz.darb.co.il</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08241a"/>
      <stop offset="1" stop-color="#03110c"/>
    </linearGradient>
    <clipPath id="app" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx="0.23"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="339" rx="24" fill="url(#bg)" stroke="#1d5a43" stroke-opacity="0.8"/>
  <image x="496" y="36" width="64" height="64" clip-path="url(#app)" href="data:image/png;base64,"/>
  <g font-family="Ubuntu, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <text x="40" y="76" fill="#fbf7ec" font-size="32" font-weight="700" letter-spacing="-0.4">YellowShifts</text>
  <text fill="#a9b8ad" font-size="18.5"><tspan x="40" y="114">Shift scheduling and attendance for fuel stations.</tspan><tspan x="40" dy="26">In pilot at a working Paz station.</tspan></text>
  <path d="M 44 190 l 5 -5 l 5 5 l -5 5 Z" fill="#d9a54c"/><text x="66" y="196" fill="#efe8d6" font-size="18">Workers clock in by tapping an NFC tag</text>
  <path d="M 44 224 l 5 -5 l 5 5 l -5 5 Z" fill="#d9a54c"/><text x="66" y="230" fill="#efe8d6" font-size="18">Access enforced by Postgres row-level security</text>
  <path d="M 44 258 l 5 -5 l 5 5 l -5 5 Z" fill="#d9a54c"/><text x="66" y="264" fill="#efe8d6" font-size="18">One hours engine for web, admin and mobile</text>
  <path d="M 40 290 H 560" stroke="#0e3527"/>
  <text x="40" y="318" fill="#7f978a" font-size="15.5">Next.js 16, Expo, Supabase</text>
  <text x="560" y="318" fill="#f0c77a" font-size="16" font-weight="500" text-anchor="end">paz.darb.co.il</text>
  </g>
</svg>
